<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Piscine Web</title>
    <style>
        /* Center everything nicely */
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        /* Container to hold both images side-by-side and centered */
        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* Space between the images */
            margin-top: 20px;
        }

        /* Set a clean, controlled size for the images */
        .image-container img {
            max-width: 400px; /* Adjust this to make them bigger or smaller */
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Piscine Web</h1>

    <div class="image-container">
        <!-- First image wrapped in a link -->
        <a href="https://www.youtube.com/watch?v=INscMGmhmX4" target="_blank">
            <img src="https://s3.amazonaws.com/rails-camp-tutorials/blog/programming+memes/programming-or-googling.jpg" alt="large">
        </a>
        <img src="https://s3.amazonaws.com/rails-camp-tutorials/blog/programming+memes/states-of-a-programmer.png" alt="large">
    </div>
</body>
</html>
