<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
    <style>
        /* Removes default browser spacing and sets full height */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        /* Forces the table to stretch across the entire screen */
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            text-align: center;
            border: 1px solid black;
            font-family: Arial, sans-serif;
            
            /* Responsive text: 5vw means 5% of the browser's total width */
            font-size: 5vw; 
        }

        .cell1 {
            background-color: #000000; /* Black */
            color: white;
        }

        .cell2 {
            background-color: #0055ff; /* 42 Blue */
            color: white;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="cell1">42</td>
            <td class="cell2">Bangkok</td>
        </tr>
    </table>

</body>
</html>
