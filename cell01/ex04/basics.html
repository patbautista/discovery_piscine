<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
        }
        h1 {
            color: white;
            text-align: center;
        }
        .shops-container {
            display: flex;
            justify-content: center;
            gap: 50px;
            text-align: center;
            margin-top: 30px;
        }
        .shop-item img {
            width: 250px;
            height: 250px;
            object-fit: contain;
            display: block;
            margin-bottom: 10px;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
        }
        .footer {
            text-align: center;
            font-style: italic;
            font-family: monospace;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Online Shops!</h1>

    <div class="shops-container">
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/Adidas_Logo.svg" alt="Adidas Logo">
            <a href="https://www.adidas.com" target="_blank">Adidas</a>
        </div>
        <div class="shop-item">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Logo_NIKE.svg" alt="Nike Logo">
            <a href="https://www.nike.com" target="_blank">Nike</a>
        </div>
    </div>

    <hr>

    <div class="footer">
        &copy; pbautist2026
    </div>

</body>
</html>
