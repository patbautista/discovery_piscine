<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            height: 400px;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            padding: 20px;
            text-align: center;
            border: 1px solid black;
            font-size: 50px;
        }
        .cell1 {
            background-color: #000000; /* Black */
            color: white; /* Makes the text visible */
        }
        .cell2 {
            background-color: #38bdf8; /* 42 Cyan */
            color: white; /* Makes the text visible */
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="cell1">42</td>
            <td class="cell2">Bangkok</td>
        </tr>
    </table>
</body>
</html>
