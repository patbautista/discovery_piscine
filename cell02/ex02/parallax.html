<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Exercise</title>
    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="parallax.css">
</head>
<body>

    <!-- First section: Parallax background image 1 with centered message -->
    <div class="parallax-section image1">
        <div class="message">
            <h2>Welcome to my page!</h2>
        </div>
    </div>

    <!-- Middle section: Black background block with custom message -->
    <div class="content-section">
        <p>This is a dark block section in the middle of the page.</p>
    </div>

    <!-- Bottom section: Parallax background image 2 with centered message -->
    <div class="parallax-section image2">
        <div class="message">
            <h2>You reached the bottom!</h2>
        </div>
    </div>

</body>
</html>
