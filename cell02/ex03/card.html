<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <!-- Link external stylesheet -->
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <!-- Main profile card container -->
    <div class="card">
        
        <!-- Header at the top of the card -->
        <div class="card-header">
            <h2>User Profile Card</h2>
        </div>

        <!-- Invisible table used to align content as required -->
        <table class="profile-table">
            <!-- Row for Profile Picture -->
            <tr>
                <td>
                    <img src="https://via.placeholder.com/120" alt="Profile Picture" class="profile-pic">
                </td>
            </tr>

            <!-- Row for Login/Username -->
            <tr>
                <td class="login">
                    <strong>pbautista</strong>
                </td>
            </tr>

            <!-- Row for 2-3 words description -->
            <tr>
                <td class="description">
                    Aspiring Web Developer
                </td>
            </tr>

            <!-- Row for Social Media Icons -->
            <tr>
                <td class="social-icons">
                    <!-- Social icons wrapped in links -->
                    <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
                    <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="GitHub"></a>
                    <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png" alt="LinkedIn"></a>
                </td>
            </tr>

            <!-- Row for Contact Button -->
            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>

    </div>

</body>
</html>
